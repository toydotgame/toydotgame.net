# jekyll-serve.sh calls this file specifically after _config.yml, whereas the
# production/GH pages build doesn't use that script and therefore doesn't use
# this config.

# BUILD
#incremental:         true
show_drafts:         true
strict_front_matter: true
unpublished:         true
#compress_html:
#  profile:           true

# SERVE
host:       0.0.0.0 # Note that Atom feeds now handle this correctly, however
                    # jekyll-sitemap will still use http://0.0.0.0/... in its
                    # dev env. output :(
livereload: true
port:       8080
