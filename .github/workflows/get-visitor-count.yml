name: get-visitor-count
run-name: get-visitor-count run by ${{ github.actor }}
on: workflow_dispatch # TODO: Change to schedule
jobs:
  get-visitor-count:
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      - name: Run fetch script
        run: bash get-visitor-count.sh
        env:
		  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
		  ZONE_TAG: ${{ vars.ZONE_TAG }}
      - name: Echo job status
        run: echo "job.status = ${{ job.status }}"

