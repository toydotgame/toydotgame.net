name: get-visitor-count
run-name: get-visitor-count run by ${{ github.actor }}
on: workflow_dispatch # TODO: Change to schedule
jobs:
  get-visitor-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash get-visitor-count.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_TAG: ${{ vars.ZONE_TAG }}
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Updated visitor count (workflow run by ${{ github.actor }}"
          git push
      - name: job.status = ${{ job.status }}

