# AUTHOR: toydotgame
# CREATED: 2025-10-20
# Jekyll site settings based off the original auto-generated boilerplate. Note
# that Jekyll's YAML parser CANNOT PARSE TABS even for key values—use spaces!
# GitHub Pages sets the below, which we cannot change:
#################################
# lsi:                  false   #
# safe:                 true    #
# source:               .       #
# incremental:          false   #
# highlighter:          rouge   #
# gist:                         #
#   noscript:           false   #
# kramdown:                     #
#   math_engine:        mathjax #
#   syntax_highlighter: rouge   #
#################################

# Fill out as much site.* metadata we can for jekyll-seo-tag; some _includes
# also use values here:
title:       toydotgame.net
tagline:     toydotgame's personal website.
description: Welcome to my corner of the internet!
url:         https://toydotgame.net/
author:      toydotgame
twitter:
  username:  toydotgame
  card:      summary
logo:        /media/resources/profile.png
locale:      en_AU # Overrides site.lang in _some_ situations
feed:        # My custom implementation:
  length:    -1
  icon:      /media/resources/profile.png # Should be 1:1
  logo:      /media/resources/banner.png  # Should be 2:1
  path:      /feed.xml

# GLOBAL
timezone: Etc/GMT-10 # Flipped sign because POSIX

# BUILD
collections:
  posts:
    output: true
    permalink: /blog/:year/:month-:day_:title
  projects:
    output: true
    permalink: /projects/:path
defaults:
  - # The below MUST be @ index 0 (see _layouts/base.html and feed.xml)
    scope:
      path: ""
    values:
      image:  /media/resources/banner.png
      layout: base
      seo_description_max_words: 50 # Default 100
  - # See also: 404, 418, and sasha front matter; sitemap excludes:
    scope:
      path: media/*
    values:
      sitemap: false
  -
    scope:
      path: _posts
      type: posts
    values:
      aero-icon: /media/resources/aerico/book.png
# Expand upon/reiterate Jekyll's default exclude list:
exclude:
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  # Additions:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - jekyll-serve.sh
  - README.txt
future: true # Just in case
kramdown:
  auto_ids:          false
  footnote_backlink: ^
plugins:
#  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
#  - jemoji # Not using for now because image-based emoji sucks

# SERVE
webrick:
  headers:
      X-Clacks-Overhead: GNU Terry Pratchett
