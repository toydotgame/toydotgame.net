# AUTHOR: toydotgame
# CREATED: 2025-10-20
# Jekyll site settings based off the original auto-generated boilerplate. Note
# that Jekyll's YAML parser CANNOT PARSE TABS even for key values—use spaces!
# GitHub Pages sets the below, which we cannot change:
#################################
# lsi:                  false   #
# safe:                 true    #
# source:               .       #
# incremental:          false   #
# highlighter:          rouge   #
# gist:                         #
#   noscript:           false   #
# kramdown:                     #
#   math_engine:        mathjax #
#   syntax_highlighter: rouge   #
#################################

# Fill out as much site.* metadata we can for jekyll-seo-tag; some _includes
# also use values here:
title:              toydotgame.net
tagline:            toydotgame's personal website.
description:        Welcome to my corner of the internet!
web_url:            &url https://toydotgame.net # Make a custom one because
                                                # `url` is overridden in dev.
url:                *url
domain:             toydotgame.net
author:             toydotgame
twitter:
  username:         toydotgame
  card:             summary
logo:               &logo /media/resources/profile.png
banner:             &banner /media/resources/banner.png
feed:               # My custom implementation:
  length:          -1      # 0–infty. Set negative to disable
  icon:            *logo   # Should be 1:1
  logo:            *banner # Should be 2:1
  path:            /feed.xml
  status_path:     /status.xml
excerpt_max_words: &excerpt_max_words 50

# GLOBAL
locale:   en_AU      # Overrides site.lang in _some_ situations
timezone: Etc/GMT-10 # Flipped sign because POSIX

# BUILD
collections:
  status:
    output: true
    permalink: /status/:slug
  posts:
    output: true
    permalink: /blog/:year/:month-:day_:title
  projects:
    output: true
    permalink: /projects/:path
compress_html:
  clippings: all
  comments:  all
defaults:
  -
    scope:
      path: ""
    values:
      image:  *banner
      layout: default
      seo_description_max_words: *excerpt_max_words # Default 100
  - # See also: 404, 418, and sasha front matter; sitemap excludes:
    scope:
      path: media/*
    values:
      sitemap: false
  -
    scope:
      path: _posts
      type: posts
    values:
      aero-icon: /media/resources/aerico/book.png
  -
    scope:
      path: _status
      type: status
    values:
      layout: status
# Expand upon/reiterate Jekyll's default exclude list:
exclude:
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  # Additions:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - jekyll-serve.sh
  - README.txt
  - TODO.txt
future: true # Just in case
kramdown:
  auto_ids:          false
  footnote_backlink: ^
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# SERVE
webrick:
  headers:
      X-Clacks-Overhead: GNU Terry Pratchett
