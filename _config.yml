# AUTHOR: toydotgame
# CREATED: 2025-10-20
# Jekyll site settings based off the original auto-generated boilerplate. Note
# that Jekyll's YAML parser CANNOT PARSE TABS even for key values—use spaces!
# GitHub Pages sets the below, which we cannot change:
#################################
# lsi:                  false   #
# safe:                 true    #
# source:               .       #
# incremental:          false   #
# highlighter:          rouge   #
# gist:                         #
#   noscript:           false   #
# kramdown:                     #
#   math_engine:        mathjax #
#   syntax_highlighter: rouge   #
#################################

#title:       toydotgame.net
#description: toydotgame's personal website.
#url:         https://toydotgame.net

# GLOBAL
timezone: Etc/GMT-10 # Flipped sign because POSIX

# BUILD
collections:
  posts:
    output: true
    permalink: /blog/:year/:month-:day_:title
  projects:
    output: true
    permalink: /projects/:path
defaults:
  -
    scope:
      path: ""
    values:
      layout: base
  -
    scope:
      path: _posts
      type: posts
    values:
      aero-icon: /media/resources/aerico/book.png
future: true # Just in case
kramdown:
  auto_ids:          false
  footnote_backlink: ^
#plugins:
#  - jemoji # Not using for now because image-based emoji sucks

# SERVE
webrick:
  headers:
      X-Clacks-Overhead: GNU Terry Pratchett

# DATA
# Expand upon/reiterate Jekyll's default exclude list:
exclude:
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - Gemfile
  - Gemfile.lock
  - vendor/
